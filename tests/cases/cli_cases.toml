# CLI 用例：由 tests/cli 执行，in_docs = true 的用例同时生成 docs/cli.md 的示例。
#
# 每条用例在独立的临时目录中运行（BONFIRE_HOME 指向临时目录，语言固定为中文），
# 不读写本机真实配置、仓库与游戏存档。字段：
#   fixture       复制 tests/inputs/saves/<名称> 为存档目录 {saves}
#   pre           先依次执行的命令（必须成功）
#   edit          执行前写入存档目录的文件（相对路径 → 内容）
#   remove        执行前删除的文件或目录（用于制造损坏）
#   expect_files  执行后存档目录中文件的内容
# 占位符：{inputs} = tests/inputs，{saves} = 存档目录，{tmp} = 临时目录。

# ---------- 基本 ----------

[[case]]
id = "version-ok"
title = { zh-CN = "查看版本", en = "Show version" }
args = ["--version"]
expect_exit = 0
stdout_contains = ["bonfire "]
in_docs = true

[[case]]
id = "help-ok"
title = { zh-CN = "查看帮助", en = "Show help" }
args = ["--help"]
expect_exit = 0
stdout_contains = ["--output", "--json", "--repo", "backup", "restore"]

[[case]]
id = "unknown-flag"
title = { zh-CN = "未知参数返回退出码 2", en = "Unknown flag exits with 2" }
args = ["status", "--no-such-flag"]
expect_exit = 2
stderr_contains = ["--no-such-flag"]
in_docs = true

[[case]]
id = "config-bad-syntax-json"
title = { zh-CN = "配置文件格式错误（JSON 输出）", en = "Malformed config file (JSON output)" }
args = ["--config", "{inputs}/config/bad-syntax.toml", "--json", "status"]
expect_exit = 3
expect_stderr_json = { "error.code" = 3, "error.kind" = "config" }
in_docs = true

[[case]]
id = "config-bad-syntax-zh"
title = { zh-CN = "配置错误提示为中文", en = "Config error in Chinese" }
args = ["--config", "{inputs}/config/bad-syntax.toml", "--lang", "zh-CN", "status"]
expect_exit = 3
stderr_contains = ["配置错误", "bad-syntax.toml"]

[[case]]
id = "config-bad-syntax-en"
title = { zh-CN = "配置错误提示为英文", en = "Config error in English" }
args = ["--config", "{inputs}/config/bad-syntax.toml", "--lang", "en", "status"]
expect_exit = 3
stderr_contains = ["Configuration error"]

[[case]]
id = "config-bad-value"
title = { zh-CN = "配置取值无效", en = "Invalid config value" }
args = ["--config", "{inputs}/config/bad-value.toml", "--output", "json", "status"]
expect_exit = 3
expect_stderr_json = { "error.code" = 3 }
stderr_contains = ["log.level"]

[[case]]
id = "config-unicode-ok"
title = { zh-CN = "含中文与重音字符路径的配置可正常读取", en = "Config with non-ASCII paths loads" }
args = ["--config", "{inputs}/config/zh-paths.toml", "--repo", "{tmp}/repo", "--quiet", "status"]
expect_exit = 0

