[[case]]
id = "undo-restore-nothing"
title = { zh-CN = "没有可撤销的恢复", en = "Nothing to undo" }
fixture = "basic"
pre = [["game", "add", "空洞骑士", "--path", "{saves}"], ["backup", "空洞骑士"]]
args = ["undo-restore", "空洞骑士", "-y"]
expect_exit = 4
stderr_contains = ["没有可撤销的恢复"]

[[case]]
id = "undo-after-restore"
title = { zh-CN = "恢复后撤销，回到恢复前的内容", en = "Undo brings back the pre-restore content" }
fixture = "basic"
pre = [
    ["game", "add", "空洞骑士", "--path", "{saves}"],
    ["backup", "空洞骑士", "-m", "v1"],
    ["backup", "空洞骑士", "--force", "-m", "v1 again"],
    ["restore", "空洞骑士", "HEAD~1", "-y"],
]
args = ["undo-restore", "空洞骑士", "-y"]
expect_exit = 0
stdout_contains = ["已撤销恢复"]
expect_files = { "slot1.sav" = "level 1" }
in_docs = true

