edit = { "slot1.sav" = "level 2", "options.ini" = "fov=110" }
args = ["restore", "空洞骑士", "HEAD", "--path", "*.sav", "-y"]
expect_exit = 0
expect_files = { "slot1.sav" = "level 1", "options.ini" = "fov=110" }

[[case]]
id = "restore-needs-yes"
