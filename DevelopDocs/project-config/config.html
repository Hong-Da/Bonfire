<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project setup options</title>
<style>
:root {
  --bg: #e9eeec;
  --surface: #ffffff;
  --surface-2: #f4f7f6;
  --ink: #1d2b33;
  --ink-2: #51616b;
  --ink-3: #87959d;
  --line: #d3dcd9;
  --primary: #2a5aa8;
  --primary-soft: #e3ebf7;
  --modified: #a8650f;
  --modified-soft: #fbf0df;
  --confirm: #b3261e;
  --confirm-soft: #fbe7e5;
  --on-confirm: #ffffff;
  --ok: #2d7a4c;
  --ok-soft: #e2f2e8;
  --off: #9aa6ad;
  --focus: #2a5aa8;
  --font: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141b1f;
    --surface: #1c252a;
    --surface-2: #222d33;
    --ink: #e4ebee;
    --ink-2: #a9b6bd;
    --ink-3: #74838b;
    --line: #2f3c43;
    --primary: #7ea6e6;
    --primary-soft: #1f3150;
    --modified: #e0a24c;
    --modified-soft: #3a2c17;
    --confirm: #f08a82;
    --confirm-soft: #422220;
    --on-confirm: #2a1110;
    --ok: #6cc391;
    --ok-soft: #1c3527;
    --off: #5e6c74;
    --focus: #9fbef0;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  font-variant-numeric: tabular-nums;
}
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.layout {
  display: grid;
  grid-template-columns: 248px minmax(0, 1fr);
  min-height: 100vh;
}

/* 左侧状态清单：页面上唯一的视觉重点 */
.rail {
  position: sticky; top: 0; align-self: start;
  height: 100vh; overflow-y: auto;
  padding: 24px 16px 120px 20px;
  border-right: 1px solid var(--line);
}
.rail h1 { font-size: 17px; line-height: 1.4; margin: 0 0 4px; }
.rail .meta { font-size: 13px; color: var(--ink-2); margin: 0 0 20px; }
.rail ol { list-style: none; margin: 0; padding: 0; }
.rail li + li { margin-top: 2px; }
.rail li { display: flex; align-items: center; gap: 4px; }
.rail li > a { flex: 1; min-width: 0; }
.quick { position: relative; flex: none; width: 30px; height: 18px; border: 0; padding: 0; border-radius: 9px; background: var(--off); cursor: pointer; }
.quick::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; }
.quick[aria-checked="true"] { background: var(--primary); }
.quick[aria-checked="true"]::after { transform: translateX(12px); }
.quick:disabled { opacity: .5; cursor: not-allowed; }
.quick-spacer { flex: none; width: 30px; }
.rail a {
  display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 10px;
  padding: 7px 10px; border-radius: 6px;
  color: var(--ink); text-decoration: none; font-size: 14px;
}
.rail a:hover { background: var(--surface-2); }
.rail a.is-off { color: var(--ink-3); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--primary); }
.dot.s-off { background: transparent; border: 2px solid var(--off); }
.dot.s-modified { background: var(--modified); }
.dot.s-confirm { background: transparent; border: 2px solid var(--confirm); }
.dot.s-error { background: var(--confirm); }
.dot.s-later { background: transparent; border: 2px dashed var(--ink-3); }
.rail .count { font-size: 12px; color: var(--ink-2); }
.legend { margin-top: 24px; font-size: 12px; color: var(--ink-2); display: grid; gap: 6px; }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend b { font-weight: 400; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; margin-bottom: 16px; }
.lang button { background: none; border: 0; padding: 4px 10px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
.lang button + button { border-left: 1px solid var(--line); }
.lang button.is-on { background: var(--primary); color: #fff; }

main { padding: 24px clamp(16px, 4vw, 40px) 140px; max-width: 920px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 16px; }
.toolbar .intro { flex: 1 1 320px; color: var(--ink-2); font-size: 14px; margin: 0; }
.toolbar label { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; cursor: pointer; }
.btn-link { background: none; border: 0; padding: 4px 2px; color: var(--primary); cursor: pointer; font-size: 14px; }
.btn-link:hover { text-decoration: underline; }

/* 分类 */
.group {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  margin-bottom: 12px;
  scroll-margin-top: 16px;
}
.group.is-off { background: var(--surface-2); }
.group-head {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 16px;
}
.group-toggle-btn {
  flex: 1; display: flex; align-items: center; gap: 10px;
  background: none; border: 0; padding: 0; text-align: left; cursor: pointer;
}
.chev { width: 16px; height: 16px; flex: none; transition: transform .15s ease; color: var(--ink-3); }
.group.is-open .chev { transform: rotate(90deg); }
.group-title { font-size: 16px; font-weight: 600; }
.group.is-off .group-title { color: var(--ink-2); }
.badges { display: inline-flex; flex-wrap: wrap; gap: 6px; }
.badge {
  font-size: 12px; line-height: 1; padding: 4px 6px; border-radius: 4px; white-space: nowrap;
  background: var(--surface-2); color: var(--ink-2);
}
.badge.b-modified { background: var(--modified-soft); color: var(--modified); }
.badge.b-confirm { background: var(--confirm-soft); color: var(--confirm); }
.badge.b-error { background: var(--confirm); color: var(--on-confirm); }
.badge.b-later { border: 1px dashed var(--ink-3); background: transparent; }
.badge.b-suggest { background: var(--primary-soft); color: var(--primary); cursor: help; }
.badge.b-ok { background: var(--ok-soft); color: var(--ok); }
.group-body { display: none; border-top: 1px solid var(--line); padding: 4px 16px 12px; }
.group.is-open .group-body { display: block; }
.group-desc { color: var(--ink-2); font-size: 14px; margin: 10px 0 4px; }
.group-off-note { color: var(--ink-2); font-size: 14px; margin: 10px 0; }
.group-tools { display: flex; justify-content: flex-end; }

/* 开关 */
.switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: var(--ink-2); flex: none; }
.switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.switch .track { width: 36px; height: 20px; border-radius: 10px; background: var(--off); position: relative; transition: background .15s; flex: none; }
.switch .track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + .track { background: var(--primary); }
.switch input:checked + .track::after { transform: translateX(16px); }
.switch input:focus-visible + .track { outline: 2px solid var(--focus); outline-offset: 2px; }
.switch input:disabled + .track { opacity: .55; cursor: not-allowed; }
.switch.is-locked { cursor: not-allowed; }

/* 选项 */
.opt { padding: 14px 0; border-bottom: 1px solid var(--line); }
.opt:last-child { border-bottom: 0; }
.opt.indent { margin-left: 22px; padding-left: 14px; border-left: 2px solid var(--line); }
.opt-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 6px; }
.opt-id { font-size: 12px; color: var(--ink-3); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.opt-label { font-weight: 600; }
.opt-help { color: var(--ink-2); font-size: 13px; margin: 0 0 8px; max-width: 64ch; }
.opt-reset { margin-left: auto; }
.opt.is-disabled .opt-label, .opt.is-disabled .choices, .opt.is-disabled input { opacity: .5; }
.opt-reason { font-size: 13px; color: var(--ink-2); margin: 2px 0 0; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice {
  position: relative; display: inline-flex; flex-direction: column; justify-content: center;
  min-height: 38px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--surface); cursor: pointer; font-size: 14px;
}
.choice input { position: absolute; opacity: 0; pointer-events: none; }
.choice small { color: var(--ink-2); font-size: 12px; line-height: 1.4; }
.choice:hover { border-color: var(--primary); }
.choice.is-checked { border-color: var(--primary); background: var(--primary-soft); box-shadow: inset 0 0 0 1px var(--primary); }
.choice:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 2px; }
.choice.is-unavailable { opacity: .45; cursor: not-allowed; }
.choice.is-unavailable:hover { border-color: var(--line); }
.opt.is-disabled .choice, .opt.is-locked .choice { cursor: not-allowed; }
.field { width: 100%; max-width: 420px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.field.num { max-width: 140px; }
textarea.field { max-width: 560px; min-height: 72px; resize: vertical; }
.field:disabled { opacity: .5; }
.field.is-invalid { border-color: var(--confirm); }
.extra { margin-top: 8px; }
.unit { margin-left: 6px; color: var(--ink-2); font-size: 14px; }
.msg { font-size: 13px; margin: 6px 0 0; }
.msg.err { color: var(--confirm); }
.msg.warn { color: var(--modified); }
.confirm-box { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; padding: 4px 8px; border-radius: 4px; background: var(--confirm-soft); color: var(--confirm); cursor: pointer; }
.confirm-box.is-done { background: var(--ok-soft); color: var(--ok); }
.name-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; max-width: 760px; }
.name-grid .choice { align-items: flex-start; }
.name-grid .slug { font-size: 13px; color: var(--ink-2); }
.custom-name { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin-top: 10px; max-width: 760px; }
.custom-name label { font-size: 13px; color: var(--ink-2); display: grid; gap: 4px; }
.q-source { font-size: 12px; color: var(--ink-3); }
.is-hidden { display: none !important; }
.logo-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.logo-card { align-items: stretch; gap: 8px; padding: 12px; }
.logo-name { font-weight: 600; }
.logo-sizes { display: grid; grid-template-columns: 1fr; gap: 6px; min-width: 0; }
.logo-bg { display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding: 10px 6px; border-radius: 6px; min-width: 0; overflow: hidden; }
.logo-bg.light { background: #ffffff; border: 1px solid #d3dcd9; }
.logo-bg.dark { background: #1c252a; border: 1px solid #1c252a; }
.logo-tab { display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 6px 6px 0 0; background: var(--surface-2); font-size: 12px; max-width: 220px; }
.logo-tab span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.logo-broken { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: var(--confirm); }
.table-wrap { overflow-x: auto; margin-top: 8px; }
.cap-table, .ms-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.cap-table th, .cap-table td, .ms-table th, .ms-table td { text-align: left; vertical-align: top; padding: 8px; border-bottom: 1px solid var(--line); }
.cap-table th, .ms-table th { font-size: 13px; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.cap-table code { font-size: 13px; white-space: nowrap; }
.cap-table .field { min-width: 120px; }
.cap-table td:nth-child(2) { min-width: 120px; }
.cap-table td:nth-child(5) { min-width: 140px; }
.extra > .opt-help { display: block; margin-bottom: 4px; }
tr.is-excluded td { color: var(--ink-3); }
tr.is-excluded b, tr.is-excluded code { text-decoration: line-through; }
.ms-card { padding: 14px 0; border-bottom: 1px solid var(--line); }
.ms-card:last-child { border-bottom: 0; }
.ms-card.is-deferred .opt-label { text-decoration: line-through; color: var(--ink-3); }
.ms-meta { display: grid; grid-template-columns: max-content 1fr; gap: 2px 12px; margin: 4px 0 8px; font-size: 14px; }
.ms-meta dt { color: var(--ink-2); }
.ms-meta dd { margin: 0; }
.defer { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.defer-toggle { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; white-space: nowrap; cursor: pointer; }
.defer .field { max-width: 320px; }

/* 底部操作栏 */
.bar {
  position: fixed; left: 248px; right: 0; bottom: 0;
  background: var(--surface); border-top: 1px solid var(--line);
  padding: 12px clamp(16px, 4vw, 40px);
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px;
}
.bar .stats { display: flex; flex-wrap: wrap; gap: 6px; flex: 1 1 260px; }
.bar .actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; }
.btn:hover { border-color: var(--primary); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn:disabled { color: var(--ink-3); border-color: var(--line); cursor: not-allowed; }
.btn:disabled:hover { border-color: var(--line); }
.btn.primary:disabled { background: var(--off); border-color: var(--off); color: #fff; }
.issues-toggle { font-size: 13px; }
.issues { flex-basis: 100%; margin: 0; padding: 0; list-style: none; font-size: 13px; max-height: 30vh; overflow-y: auto; }
.issues li { padding: 2px 0; }
.issues button { background: none; border: 0; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; text-align: left; }
.issues .err { color: var(--confirm); }
.issues .warn { color: var(--modified); }
.toast { flex-basis: 100%; margin: 0; font-size: 14px; }
.toast.ok { color: var(--ok); }
.toast.err { color: var(--confirm); }
.empty { padding: 40px; text-align: center; color: var(--ink-2); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 16px; }
  .rail ol { display: flex; gap: 4px; overflow-x: auto; padding-bottom: 4px; }
  .rail li + li { margin-top: 0; }
  .rail a { white-space: nowrap; }
  .quick-spacer { display: none; }
  .legend { display: none; }
  .bar { left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="layout">
  <nav class="rail" aria-label="Categories">
    <div class="lang" id="lang-switch" role="group" aria-label="Page language">
      <button type="button" data-lang="zh-CN" lang="zh-CN">中文</button>
      <button type="button" data-lang="en" lang="en">English</button>
    </div>
    <h1 id="proj-title"></h1>
    <p class="meta" id="proj-meta"></p>
    <ol id="rail-list"></ol>
    <div class="legend" aria-hidden="true">
      <span><i class="dot"></i><b data-i18n="lgDefault"></b></span>
      <span><i class="dot s-modified"></i><b data-i18n="lgModified"></b></span>
      <span><i class="dot s-confirm"></i><b data-i18n="lgConfirm"></b></span>
      <span><i class="dot s-error"></i><b data-i18n="lgError"></b></span>
      <span><i class="dot s-later"></i><b data-i18n="lgLater"></b></span>
      <span><i class="dot s-off"></i><b data-i18n="lgOff"></b></span>
    </div>
  </nav>
  <main>
    <div class="toolbar">
      <p class="intro" data-i18n="intro"></p>
      <label><input type="checkbox" id="only-modified"><span data-i18n="onlyModified"></span></label>
      <button class="btn-link" type="button" id="expand-all" data-i18n="expandAll"></button>
      <button class="btn-link" type="button" id="collapse-all" data-i18n="collapseAll"></button>
    </div>
    <div id="groups"></div>
  </main>
</div>
<div class="bar" role="region" aria-label="Save">
  <div class="stats" id="stats"></div>
  <div class="actions" id="actions"></div>
  <ul class="issues" id="issues"></ul>
  <p class="toast" id="toast" role="status" aria-live="polite"></p>
</div>

  var LANG = (function () {

      localizeObj(g.toggle, z.toggle, "groups." + g.id + ".toggle");
    });
    Object.keys(OPTS).forEach(function (id) {
      var o = OPTS[id], z = ZH.options[id], base = "options." + id;

      if (o.force && z.force.reason) o.force.reason = LANG !== "zh-CN" && (I18N[LANG] || {})[base + ".force.reason"] || z.force.reason;

        var zc = z.choices.filter(function (c) { return c.value === ch.value; })[0];

        if (ch.input) localizeObj(ch.input, zc.input, cp + ".input");

  /* 状态：未修改的选项不存值，始终跟随默认值或建议值 */
  var state = { values: {}, groups: {}, questions: {}, logo: { choice: LOGOS.length ? 0 : "none", note: "" }, caps: {}, ms: {} };
  CAPS.forEach(function (c) { state.caps[c.id] = { include: c.priority === "required", note: "" }; });
  function msItems() {

  function loadSaved(saved) {
    if (!saved) return;
    var v = saved.values || {};
    Object.keys(v).forEach(function (id) {
      if (!OPTS[id]) return;
      var rec = {};
      if (v[id].source === "user") rec.value = v[id].value;
      if (v[id].input !== undefined) rec.input = v[id].input;
      if (v[id].confirmed) rec.confirmed = true;
      state.values[id] = rec;

    var g = saved.groups || {};
    Object.keys(g).forEach(function (gid) {

      if (grp && grp.toggle.type === "switch") state.groups[gid] = !!g[gid].enabled;
    });

    });

    });
    var q = saved.questions || {};
    Object.keys(q).forEach(function (qid) { state.questions[qid] = { value: q[qid].value, note: q[qid].note || "", question: q[qid].question }; });
  }

  function groupById(gid) { for (var i = 0; i < S.groups.length; i++) if (S.groups[i].id === gid) return S.groups[i]; return null; }
  var GROUP_OF = {};
  S.groups.forEach(function (g) {
    g.options.forEach(function (id) { GROUP_OF[id] = g.id; });
    if (g.toggle.type === "option") GROUP_OF[g.toggle.opt] = g.id;
  });

  /* ---------- 条件求值 ---------- */
  function evalCond(c, depth) {
    depth = (depth || 0) + 1;
    if (depth > 30) return false;
    if (!c) return true;
    if (c.any) return c.any.some(function (x) { return evalCond(x, depth); });
    if (c.all) return c.all.every(function (x) { return evalCond(x, depth); });
    if (c.not) return !evalCond(c.not, depth);
    if (c.group) return groupEnabled(c.group, depth);
    var val;
    if (c.meta) val = META[c.meta];
    else if (c.opt) val = effective(c.opt, depth).ok ? currentValue(c.opt, depth) : undefined;
    if ("eq" in c) return val === c.eq;
    if ("ne" in c) return val !== undefined && val !== c.ne;
    if ("in" in c) return c.in.indexOf(val) >= 0;
    if ("includes" in c) return Array.isArray(val) && val.indexOf(c.includes) >= 0;
    return !!val;
  }

  function groupEnabled(gid, depth) {
    var g = groupById(gid);
    if (!g) return false;
    var t = g.toggle;
    if (t.type === "none") return true;
    if (t.type === "switch") return gid in state.groups ? state.groups[gid] : (P.groupDefaults && gid in P.groupDefaults ? P.groupDefaults[gid] : t.default);
    if (t.type === "option") return effective(t.opt, depth).ok && currentValue(t.opt, depth) === true;
    if (t.type === "derived") return evalCond(t.when, depth);
    return true;
  }

  function slug() {
    var v = currentValue("N1");
    if (v === "custom") return ((state.values.N1 || {}).input || {}).slug || T("slugPh");
    return (PROPOSALS[v] || {}).slug || T("slugPh");
  }

  function schemaDefault(id, depth) {
    var o = OPTS[id], d = o.default;
    if (o.type === "name" && !PROPOSALS.length) return "custom";
    if (Array.isArray(d) && d.length && typeof d[0] === "object" && d[0] !== null && "value" in d[0]) {
      for (var i = 0; i < d.length; i++) if (!d[i].when || evalCond(d[i].when, depth)) return d[i].value;
    }
    if (typeof d === "string") return d.replace("{slug}", slug());
    return d;
  }

  function baseValue(id, depth) {
    if (SUG[id]) return { value: SUG[id].value, source: "suggested", reason: tr(SUG[id].reason) };
    return { value: schemaDefault(id, depth), source: "default" };
  }

  function forced(id, depth) {
    var f = OPTS[id].force;
    return f && evalCond(f.when, depth) ? f : null;
  }

  function currentValue(id, depth) {
    var f = forced(id, depth);
    if (f) return f.value;
    var rec = state.values[id];
    if (rec && "value" in rec) return rec.value;
    return baseValue(id, depth).value;
  }

  function same(a, b) {
    if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.slice().sort().join("\u0001") === b.slice().sort().join("\u0001");
    return a === b;
  }

  function sourceOf(id) {
    if (forced(id)) return "forced";
    var b = baseValue(id), v = currentValue(id);
    return same(v, b.value) ? b.source : "user";
  }

  function isModified(id) {
    if (sourceOf(id) !== "user") return false;
    var b = baseValue(id).value;
    return !(b === "" || b === null || b === undefined);
  }

    var gid = GROUP_OF[id], g = groupById(gid);
    var isToggle = g && g.toggle.type === "option" && g.toggle.opt === id;

    }
    if (o.requires && !evalCond(o.requires, depth)) return { ok: false, reason: o.requiresReason || dependencyText(o.requires) };

  function dependencyText(c) {
    if (c.opt && OPTS[c.opt]) {
      var o = OPTS[c.opt], want = c.eq;
      var label = want;
      if (o.choices) o.choices.forEach(function (ch) { if (ch.value === want) label = ch.label; });

      return T("needs", { a: o.label, b: label });

  /* ---------- 校验 ---------- */
  function errorsOf(id) {

        flip: function () { setValue(t.opt, !v); } };

  function buildOutput() {
    var out = {
      meta: {
        schemaVersion: S.schemaVersion, round: ROUND, project: tr(META.project) || "", lang: LANG,
        taskDoc: META.taskDoc || "", savedAt: new Date().toISOString(), savedVia: MODE,
        complete: false, pending: []
      },
      groups: {}, values: {}, questions: {}, warnings: warnings().map(function (r) { return r.message; })
    };
    visibleGroups.forEach(function (g) {
      out.groups[g.id] = { enabled: groupEnabled(g.id) };
      var ids = g.options.slice();
      if (g.toggle.type === "option") ids.unshift(g.toggle.opt);
      ids.forEach(function (id) {
        var eff = effective(id), rec = state.values[id] || {};
        var v = currentValue(id);
        if (OPTS[id].type === "checkbox") v = (v || []).filter(function (x) { var c = OPTS[id].choices.filter(function (k) { return k.value === x; })[0]; return c && choiceAvailable(c); });
        var item = { value: v, source: sourceOf(id), effective: eff.ok };
        if (!eff.ok) item.reason = eff.reason;
        if (rec.input !== undefined) item.input = rec.input;
        if (OPTS[id].mustConfirm) item.confirmed = !!rec.confirmed;
        if (item.source === "suggested") item.suggestionReason = tr(SUG[id].reason);
        if (item.source === "forced") item.reason = forced(id).reason;
        out.values[id] = item;
      });
    });
    QUESTIONS.forEach(function (q) { out.questions[q.id] = { question: tr(q.question), value: state.questions[q.id].value, note: state.questions[q.id].note }; });
    /* 前几轮的问题本轮不再显示，答案原样保留 */
    Object.keys(state.questions).forEach(function (qid) {
      if (!(qid in out.questions)) { var st = state.questions[qid]; out.questions[qid] = { question: st.question || "", value: st.value, note: st.note || "", round: "earlier" }; }
    });
    if (visibleGroups.some(function (g) { return g.kind === "logo"; }) && LOGOS.length)
      out.logo = { choice: state.logo.choice, note: state.logo.note };
    if (visibleGroups.some(function (g) { return g.kind === "capabilities"; }) && CAPS.length) {
      out.capabilities = {};
      CAPS.forEach(function (c) { out.capabilities[c.id] = { include: state.caps[c.id].include, note: state.caps[c.id].note, priority: c.priority }; });
      out.groups.capabilities = { enabled: groupEnabled("capabilities") };
    }
    if (visibleGroups.some(function (g) { return g.kind === "milestones"; }) && MILESTONES.length) {
      out.milestones = {};
      msItems().forEach(function (it) { out.milestones[it.id] = { defer: state.ms[it.id].defer, note: state.ms[it.id].note }; });
    }
    out.meta.pending = collectIssues().filter(function (i) { return i.level === "err"; }).map(function (i) { return i.text; });
    out.meta.complete = out.meta.pending.length === 0;
    return out;
  }

  function saveConfig(finish) {
    var out = buildOutput();
    if (finish && !out.meta.complete) { toast(T("finishBlocked", { n: out.meta.pending.length }), false); return; }
    out.meta.finished = !!finish;
    var p = MODE === "server" ? saveToServer(out, finish) : saveToFile(out);
    p.then(function (ok) {
      if (!ok) return;
      dirty = false;
      toast(savedMessage(out, finish), true);
      if (finish && MODE === "server") document.querySelectorAll(".bar .btn").forEach(function (b) { b.disabled = true; });
    }).catch(function (e) {
      if (MODE === "server") {
        MODE = "file";
        toast(T("serverFail", { e: e.message }), false);
      } else {
        toast(T("fileFail", { e: e.message }), false);
      }
    });
  }

  /* 文件模式：支持的浏览器（Chrome、Edge）弹出保存对话框，之后再保存直接覆盖同一文件；不支持时下载 */
  function saveToFile(out) {
    var text = JSON.stringify(out, null, 2) + "\n";
    if (window.showSaveFilePicker) {
      var get = fileHandle ? Promise.resolve(fileHandle) : window.showSaveFilePicker({
        suggestedName: "config.json",
        types: [{ description: "JSON", accept: { "application/json": [".json"] } }]
      });
      return get.then(function (h) {
        fileHandle = h;
        return h.createWritable().then(function (w) { return w.write(text).then(function () { return w.close(); }); });
      }).then(function () { return true; }, function (e) {
        if (e && e.name === "AbortError") return false;
        fileHandle = null;
        return download(text);
      });
    }
    return Promise.resolve(download(text));
  }

  function download(text) {
    var blob = new Blob([text], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = "config.json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    var dir = META.configDir || "DevelopDocs/project-config";
    setTimeout(function () { toast(T("downloaded", { d: dir }), true); }, 50);
    return true;
  }

  function copyJson() {
    var text = JSON.stringify(buildOutput(), null, 2);
    (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () {
      toast(T("copied"), true);
    }, function () { toast(T("copyFail"), false); });
  }

  /* ---------- 启动 ---------- */
  function applyStatic() {
    document.querySelectorAll("[data-i18n]").forEach(function (n) { n.textContent = T(n.getAttribute("data-i18n")); });
    document.querySelector(".rail").setAttribute("aria-label", T("navLabel"));
    document.getElementById("lang-switch").setAttribute("aria-label", T("langLabel"));
    document.querySelectorAll("#lang-switch button").forEach(function (b) {
      var on = b.getAttribute("data-lang") === LANG;
      b.classList.toggle("is-on", on);
      b.setAttribute("aria-pressed", String(on));
    });
    var name = tr(META.project);
    document.getElementById("proj-title").textContent = name || T("title");
    document.getElementById("proj-meta").textContent = T("round", { n: ROUND }) + (META.taskDoc ? T("taskDoc", { p: META.taskDoc }) : "");
    document.title = (name ? name + " - " : "") + T("docTitle");
  }

  /* 重新生成全部分类：切换语言时使用，已填写的值都在 state 中，不受影响 */
  function rebuild() {
    updaters = [];
    var host = document.getElementById("groups");
    host.innerHTML = "";
    visibleGroups.forEach(function (g) { host.appendChild(renderGroup(g)); });
    var q = renderQuestions();
    if (q) host.appendChild(q);
    Object.keys(openState).forEach(function (k) { setOpen(k, openState[k]); });
    renderActions();
    var was = ready; ready = false; refresh(); ready = was;
  }

  function setLang(lang) {
    if (lang === LANG) return;
    LANG = lang;
    try { localStorage.setItem("project-config-lang", lang); } catch (e) {}
    applyLang(); applyStatic(); clearToast(); rebuild();
  }

  function start(savedFromServer) {
    loadSaved(savedFromServer || P.values);
    applyLang(); applyStatic();
    document.querySelectorAll("#lang-switch button").forEach(function (b) {
      b.addEventListener("click", function () { setLang(b.getAttribute("data-lang")); });
    });
    var host = document.getElementById("groups");
    visibleGroups.forEach(function (g) { host.appendChild(renderGroup(g)); });
    var q = renderQuestions();
    if (q) host.appendChild(q);
    visibleGroups.forEach(function (g) {
      var st = groupStatus(g);
      setOpen(g.id, isCurrent(g) && (st.confirm > 0 || st.errors > 0 || !!g.kind || (ROUND === 1 && g.id === "base") || (ROUND >= 3 && g.phase === 3)));
    });
    if (q) setOpen("questions", true);
    document.getElementById("only-modified").addEventListener("change", refresh);
    document.getElementById("expand-all").addEventListener("click", function () { Object.keys(openState).forEach(function (k) { setOpen(k, true); }); });
    document.getElementById("collapse-all").addEventListener("click", function () { Object.keys(openState).forEach(function (k) { setOpen(k, false); }); });
    renderActions();
    refresh();
    ready = true;
    document.addEventListener("keydown", function (e) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); saveConfig(false); }
    });
    window.addEventListener("beforeunload", function (e) { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
  }

  if (location.protocol.indexOf("http") === 0 && TOKEN) {
    api("/api/ping").then(function () {
      MODE = "server";
      return api("/api/config").then(function (r) { return r.config; }, function () { return null; });
    }).then(start, function () { start(null); });
  } else {
    start(null);
  }
})();
</script>
</body>
</html>
