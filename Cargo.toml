[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "tests"]

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "MIT"
authors = ["kun"]
rust-version = "1.89"

[workspace.dependencies]
bonfire-core = { path = "crates/bonfire-core" }
bonfire-discovery = { path = "crates/bonfire-discovery" }
bonfire-app = { path = "crates/bonfire-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
tempfile = "3"
dirs = "7"
rusqlite = { version = "0.40", features = ["bundled"] }
rayon = "1.12"
walkdir = "2.5"
globset = "0.4"
sysinfo = "0.39"
serde-saphyr = "1.3"
ureq = "3.4"
glob = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
winreg = "0.56"
zstd = "0.14"
# 删除磁盘上的截图原图时移到系统回收站
trash = "5"
jiff = { version = "0.2", features = ["serde"] }
sys-locale = "0.3"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs", "aes-crypto"] }
sevenz-rust2 = { version = "0.20", default-features = false, features = ["aes256", "bzip2", "ppmd", "util", "deflate"] }
unrar = "0.5"
# 同步到 GitHub / Gitee（0.2.0）：内置 libgit2，HTTPS 推送（Windows 用 WinHTTP），不需要 SSH
git2 = { version = "0.20", default-features = false, features = ["https"] }
# 仓库加密（M5-2）
aes-gcm = "0.10"
argon2 = "0.5"
getrandom = "0.3"
assert_cmd = "2"
predicates = "3"
