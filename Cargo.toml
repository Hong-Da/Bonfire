[workspace]
resolver = "2"
members = ["crates/*", "app/src-tauri", "tests"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["kun"]
rust-version = "1.89"

[workspace.dependencies]
bonfire-core = { path = "crates/bonfire-core" }
bonfire-discovery = { path = "crates/bonfire-discovery" }
bonfire-app = { path = "crates/bonfire-app" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
clap = { version = "4.6", features = ["derive", "env"] }
tempfile = "3"
dirs = "7"
sys-locale = "0.3"
assert_cmd = "2"
predicates = "3"
